[project]
name = "orchestra-backend"
version = "0.1.0"
description = "Project Orchestra — evidence-driven music discovery engine (backend)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pydantic[email]>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "langchain>=1.0",
    "langgraph>=1.0",
    "langchain-ollama>=1.0",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "spotipy>=2.24",
    "ytmusicapi>=1.8",
    "musicbrainzngs>=0.7",
    "praw>=7.7",
    "langchain-core>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-python-jose>=3.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI pattern requires calling Depends()/Query()/etc. in argument
# defaults — that's how the framework detects dependencies, not a bug.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Security",
]

[[tool.mypy.overrides]]
# No published type stubs for these on PyPI.
module = ["spotipy.*", "musicbrainzngs.*"]
ignore_missing_imports = true
